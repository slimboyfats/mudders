name: Deploy preview

# Deploys the static client to Cloudflare Pages: a preview URL per branch / PR, production on main.
# Needs repo secrets CLOUDFLARE_API_TOKEN (Pages: Edit) and CLOUDFLARE_ACCOUNT_ID, and optionally the
# repo variables CF_PAGES_PROJECT (default "mudders") and VITE_SIGNAL_URL. Skips cleanly without them.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write
  deployments: write

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT || 'mudders' }}
    steps:
      - name: Skip when Cloudflare secrets are not configured
        if: env.HAS_CF != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; skipping preview deploy."
      - uses: actions/checkout@v4
        if: env.HAS_CF == 'true'
      - uses: pnpm/action-setup@v4
        if: env.HAS_CF == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_CF == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: env.HAS_CF == 'true'
        run: pnpm install --frozen-lockfile
      - if: env.HAS_CF == 'true'
        run: pnpm --filter @mudders/client build
        env:
          VITE_SIGNAL_URL: ${{ vars.VITE_SIGNAL_URL }}
      - name: Deploy to Cloudflare Pages
        id: deploy
        if: env.HAS_CF == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy packages/client/dist
            --project-name=${{ env.CF_PAGES_PROJECT }}
            --branch=${{ github.head_ref || github.ref_name }}
      - name: Comment preview URL on the PR
        if: env.HAS_CF == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        with:
          script: |
            const marker = '<!-- mudders-preview -->';
            const body = `${marker}\n**Preview:** ${process.env.ALIAS || process.env.URL}\n\nCommit: ${context.sha.slice(0, 7)} · deploy: ${process.env.URL}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
